apiVersion: apps/v1 # 이 스크립트가 사용할 쿠버네티스 API의 버전을 정의합니다.
kind: Deployment # 생성할 쿠버네티스 리소스의 종류가 '디플로이먼트'임을 명시합니다.
metadata:
  name: main-api-server # 이 디플로이먼트 리소스의 고유 이름을 지정합니다[cite: 3].
  labels:
    app: main-api-server # 관리 편의를 위해 이 리소스에 'main-api-server'라는 태그(라벨)를 붙입니다[cite: 3].
spec:
  replicas: 2 # 가용성을 위해 이 애플리케이션 파드(컨테이너)를 항상 2개 유지하도록 설정합니다[cite: 3].
  revisionHistoryLimit: 3 # 롤백을 위해 저장할 이전 배포 이력(버전)의 최대 개수를 3개로 제한합니다[cite: 3].
  minReadySeconds: 10 # 새 파드가 켜진 후, 최소 10초 동안 안정적이어야 비로소 정상 파드로 인정합니다[cite: 3].
  strategy:
    type: RollingUpdate # 기존 파드를 하나씩 새 파드로 교체하는 '무중단 배포(롤링 업데이트)' 방식을 사용합니다[cite: 3].
    rollingUpdate:
      maxSurge: 1 # 배포 진행 중 설정된 2개보다 순간적으로 최대 1개 더 많은 파드를 띄울 수 있게 허용합니다[cite: 3].
      maxUnavailable: 0 # 배포 중에도 사용할 수 없는 파드의 개수를 0개로 설정하여 서비스 중단을 완전히 방지합니다[cite: 3].
  selector:
    matchLabels:
      app: main-api-server # 아래 template에 정의된 라벨과 일치하는 파드들을 이 디플로이먼트가 관리하도록 지정합니다[cite: 3].
  template:
    metadata:
      labels:
        app: main-api-server # 생성될 파드(컨테이너)들에 부여할 태그(라벨)를 정의합니다[cite: 3].
    spec:
      terminationGracePeriodSeconds: 40 # 파드가 종료될 때 안전한 정리를 위해 쿠버네티스가 기다려줄 최대 유예 시간(40초)입니다[cite: 3].
      containers:
        - name: main-api-server # 파드 내부에서 실행될 컨테이너의 이름을 지정합니다[cite: 3].
          image: docker.io/your-dockerhub-username/main-api-server:local # 사용할 도커 이미지 주소입니다 (CI 및 Kustomize에 의해 치환됨)[cite: 3, 4].
          imagePullPolicy: IfNotPresent # 로컬에 해당 도커 이미지가 이미 있으면 다운로드를 건너뛰고 그것을 사용합니다[cite: 3].
          ports:
            - name: http # 이 포트 설정의 이름을 'http'로 지정합니다[cite: 3].
              containerPort: 8080 # 컨테이너 내부의 스프링부트 애플리케이션이 실제로 사용하는 포트 번호입니다[cite: 3].
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"] # 파드가 완전히 종료되기 전 10초간 대기하여 유실되는 요청이 없도록 안전장치를 둡니다[cite: 3].
          readinessProbe: # 준비성 검사: 애플리케이션이 구동되어 실제로 사용자의 요청(트래픽)을 받을 준비가 됐는지 체크합니다[cite: 3].
            httpGet:
              path: /api/health # 트래픽 인입 전 헬스체크를 보낼 API 경로입니다[cite: 3].
              port: http # 위에 정의한 'http(8080)' 포트로 헬스체크를 보냅니다[cite: 3].
            initialDelaySeconds: 5 # 파드가 처음 구동을 시작하고 5초가 지난 뒤부터 준비성 검사를 시작합니다[cite: 3].
            periodSeconds: 5 # 5초마다 주기적으로 준비성 검사를 실시합니다[cite: 3].
            timeoutSeconds: 2 # 헬스체크 요청 후 응답을 기다리는 제한 시간은 최대 2초입니다[cite: 3].
            failureThreshold: 3 # 연속으로 3번 실패하면 이 파드는 아직 준비되지 않은 상태로 간주하여 트래픽을 차단합니다[cite: 3].
          livenessProbe: # 활성 검사: 애플리케이션이 다운되거나 먹통(Deadlock)이 되지 않고 살아있는지 지속적으로 감시합니다[cite: 3].
            httpGet:
              path: /api/health # 살아있는지 체크하기 위해 주기적으로 보낼 API 경로입니다[cite: 3].
              port: http # 마찬가지로 'http(8080)' 포트로 활성 검사 요청을 보냅니다[cite: 3].
            initialDelaySeconds: 15 # 파드가 켜지고 애플리케이션 초기 부팅 시간을 고려해 15초 뒤부터 활성 검사를 시작합니다[cite: 3].
            periodSeconds: 10 # 10초마다 주기적으로 활성 검사를 실시합니다[cite: 3].
            timeoutSeconds: 2 # 활성체크 요청 후 응답을 기다리는 제한 시간은 최대 2초입니다[cite: 3].
            failureThreshold: 3 # 연속으로 3번 실패하면 이 컨테이너는 회생 불가능으로 판단하고 쿠버네티스가 강제로 재시작시킵니다[cite: 3].
          resources:
            requests:
              cpu: 100m # 파드가 생성될 때 최소한으로 보장해 주어야 하는 CPU 자원량(0.1개)입니다[cite: 3].
              memory: 128Mi # 파드가 생성될 때 최소한으로 보장해 주어야 하는 메모리 용량(128메가바이트)입니다[cite: 3].
            limits:
              cpu: 500m # 이 파드가 아무리 폭주해도 최대 CPU 0.5개까지만 사용하도록 강력히 제한합니다[cite: 3].
              memory: 512Mi # 이 파드가 아무리 폭주해도 최대 메모리 512메가바이트까지만 사용하도록 제한하여 노드를 보호합니다[cite: 3].